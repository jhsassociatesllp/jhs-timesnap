<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IT Clearance — JHS Timesnap</title>
  <link rel="icon" type="image/png" href="/static/jhs_logo.jpg" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <link rel="stylesheet" href="/static/exit_management/css/employee_exit.css?v=20261123a" />
  <link rel="stylesheet" href="/static/exit_management/css/manager.css?v=20261123a" />
</head>
<body class="ex-body">

<nav class="ex-nav">
  <div class="ex-brand"><i class="fas fa-door-open"></i> JHS Exit Management</div>
  <div class="ex-nav-right">
    <span class="ex-badge" id="exEmpBadge"></span>
    <a class="ex-navbtn" href="/exit-management"><i class="fas fa-file-lines"></i> My Exit Form</a>
    <a class="ex-navbtn" href="/modules"><i class="fas fa-th-large"></i> Modules</a>
    <button class="ex-navbtn" id="exLogout"><i class="fas fa-sign-out-alt"></i> Logout</button>
  </div>
</nav>

<div class="ex-wrap">
  <main class="ex-container ex-wide">
    <div class="ex-tabs" role="tablist">
      <a class="ex-tab" href="/exit-management"><i class="fas fa-door-open"></i> Employee Exit Form</a>
      <button type="button" class="ex-tab active" role="tab"><i class="fas fa-laptop-code"></i> IT Clearance</button>
    </div>

    <div class="ex-loading" id="itLoading"><i class="fas fa-spinner fa-spin"></i> Loading exit applications…</div>
    <div class="ex-alert error" id="itError" role="alert"></div>

    <div id="itMain" style="display:none">

      <section class="ex-card pink">
        <h2><i class="fas fa-file-circle-check"></i> IT Team Exit Applications <span class="ex-count" id="itAppCount"></span></h2>
        <p class="ex-empty" id="itNoApps" style="display:none">No employee has submitted an Employee Exit Form yet.</p>
        <div class="ex-table-wrap" id="itAppsWrap">
          <table class="ex-table" id="itAppTable">
            <thead><tr><th class="c">S.No</th><th class="c">View</th><th>Employee ID</th><th>Employee Name</th><th>Designation</th><th>Resignation Date</th><th>Last Working Date</th><th>Reporting Manager Approval</th><th>IT Clearance</th><th>Action</th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
      </section>
    </div>
  </main>
</div>
<!-- eye icon: every column of one application, stacked vertically -->
<div class="ex-popup ex-light" id="itDetail" hidden>
  <div class="ex-popup-box ex-detail-box" role="dialog" aria-modal="true" aria-labelledby="itDetailTitle">
    <div class="ex-popup-top"><h2 id="itDetailTitle"></h2><button type="button" class="ex-close-btn" id="itDetailClose">Close</button></div>
    <div class="ex-detail-body" id="itDetailBody"></div>
  </div>
</div>
<!-- popup: the IT Clearance form, shown on this page -->
<div class="ex-popup ex-light" id="itPopup" hidden>
  <div class="ex-popup-box" role="dialog" aria-modal="true" aria-labelledby="itPopupTitle">
    <div class="ex-popup-top"><h2 id="itPopupTitle"></h2><button type="button" class="ex-close-btn" id="itPopupClose">Close</button></div>
    <iframe id="itFrame" title="IT Clearance form"></iframe>
  </div>
</div>
<div class="ex-toast" id="exToast"></div>

<script src="/static/exit_management/js/employee_details.js?v=20261123a"></script>
<script src="/static/exit_management/js/it.js?v=20261123a"></script>
</body>
</html>
