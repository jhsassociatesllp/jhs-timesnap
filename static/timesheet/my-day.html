<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
    <title>Timesheet — JHS</title>
    <link rel="icon" type="image/png" href="/static/jhs_logo.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/static/timesheet/my-day.css" />
  </head>
  <body>
    <div id="boot" class="boot">Loading your timesheet…</div>

    <div id="app" hidden>
      <header class="top">
        <div class="top-in">
          <strong class="brand">JHS Timesnap</strong>
          <nav class="nav" aria-label="Main">
            <a href="/timesheet" class="on" aria-current="page">Timesheet</a>
            <a href="/static/timesheet/index.html" title="The classic timesheet grid">Classic view</a>
            <a href="/modules">Modules</a>
          </nav>
          <div class="top-r"><span id="who"></span><button id="logout" class="linkbtn" type="button">Log out</button></div>
        </div>
      </header>

      <main>
        <div id="banners" aria-live="polite"></div>

        <div class="cyclebar">
          <div>
            <div class="cyc-label" id="cycLabel"></div>
            <h1 id="dayTitle"></h1>
            <div class="daynav">
              <button class="iconbtn" id="prevDay" type="button" aria-label="Previous day">‹</button>
              <input class="inp" id="datePick" type="date" aria-label="Pick a date" style="width:auto;height:32px" />
              <button class="iconbtn" id="nextDay" type="button" aria-label="Next day">›</button>
              <button class="iconbtn" id="todayBtn" type="button">Today</button>
            </div>
          </div>
          <div>
            <div class="strip" id="strip" aria-label="Days of this cycle"></div>
            <div class="strip" style="margin-top:8px"><span class="stripsum" id="stripSum"></span>
              <span class="stripnav"><button class="iconbtn" id="prevCycle" type="button">‹ Earlier cycle</button><button class="iconbtn" id="nextCycle" type="button">Later cycle ›</button></span>
            </div>
          </div>
        </div>

        <div class="locbar">
          <label for="loc">Where did you work?</label>
          <select class="inp" id="loc"></select>
          <span id="saveState" class="save-state" role="status" aria-live="polite"></span>
        </div>

        <div class="cols">
          <aside class="side">
            <section class="card" aria-labelledby="mtH">
              <h2 id="mtH">My tasks today</h2>
              <p class="sub">From Nexus Quant · tasks running on this date, plus overdue ones</p>
              <div class="taskcards" id="taskCards"></div>
            </section>
          </aside>

          <section class="card work" aria-labelledby="twH">
            <h2 id="twH">Today's work</h2>
            <div id="workBody"></div>

            <div class="totals" id="totals" hidden>
              <div><div class="k">Hours today</div><div class="v mono" id="tHours">0</div></div>
              <div><div class="k">Rows</div><div class="v mono" id="tRows">0</div></div>
              <div><div class="k">Standard day</div><div class="v mono">8.5</div></div>
            </div>
            <ul class="hints" id="hints"></ul>

            <div class="submitrow">
              <p id="submitNote">Hours are what you worked. Submitting sends the day to your manager.</p>
              <button class="btn primary" id="submitBtn" type="button">Submit day</button>
            </div>
          </section>
        </div>
      </main>
    </div>

    <div class="plist" id="plist" role="listbox" hidden></div>
    <script src="/static/timesheet/my-day.js"></script>
  </body>
</html>
