<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
    <title>Timesheet — JHS</title>
    <link rel="icon" type="image/png" href="/static/jhs_logo.jpg" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/static/timesheet/styles.css" />
    <link rel="stylesheet" href="/static/timesheet/shell.css" />
    <link rel="stylesheet" href="/static/timesheet/my-day.css" />
  </head>
  <body>
    <div id="appNav" data-active="myday"></div>

    <div class="container md">
      <div class="header"><h1><i class="fas fa-stopwatch"></i> My timesheet</h1></div>

      <div id="boot" class="boot">Loading your timesheet…</div>

      <div id="app" class="md-body" hidden>
        <div id="banners" aria-live="polite"></div>

        <section class="day-head">
          <div class="day-head-l">
            <div class="cyc-label" id="cycLabel"></div>
            <h2 id="dayTitle"></h2>
            <div class="daynav">
              <button class="iconbtn" id="prevDay" type="button" aria-label="Previous day"><i class="fas fa-chevron-left"></i></button>
              <input class="inp" id="datePick" type="date" aria-label="Pick a date" />
              <button class="iconbtn" id="nextDay" type="button" aria-label="Next day"><i class="fas fa-chevron-right"></i></button>
              <button class="iconbtn" id="todayBtn" type="button">Today</button>
            </div>
          </div>
          <div class="day-head-r">
            <div class="strip" id="strip" aria-label="Days of this cycle"></div>
            <div class="stripfoot">
              <span class="stripsum" id="stripSum"></span>
              <span class="stripnav">
                <button class="iconbtn" id="prevCycle" type="button"><i class="fas fa-angles-left"></i> Earlier cycle</button>
                <button class="iconbtn" id="nextCycle" type="button">Later cycle <i class="fas fa-angles-right"></i></button>
              </span>
            </div>
            <div class="legend" aria-hidden="true">
              <span><i class="dot submitted"></i>Submitted</span><span><i class="dot saved"></i>Saved</span>
              <span><i class="dot missing"></i>To do</span><span><i class="dot off"></i>Day off</span>
            </div>
          </div>
        </section>

        <div class="locbar">
          <div class="form-group">
            <label for="loc">Where did you work?</label>
            <select class="inp" id="loc"></select>
          </div>
          <span id="saveState" class="save-state" role="status" aria-live="polite"></span>
        </div>

        <div class="cols">
          <aside class="side">
            <section class="card" aria-labelledby="mtH">
              <h3 id="mtH"><i class="fas fa-list-check"></i> My tasks today</h3>
              <p class="sub">From Nexus Quant: tasks running on this date, plus overdue ones. Click one to add it.</p>
              <div class="tsearch" id="taskSearchWrap">
                <i class="fas fa-magnifying-glass"></i>
                <input class="inp" id="taskSearch" type="search" placeholder="Search tasks, clients or projects" aria-label="Search my tasks" autocomplete="off" />
              </div>
              <div class="tsummary" id="taskSummary"></div>
              <div class="taskcards" id="taskCards"></div>
            </section>
          </aside>

          <section class="card work" aria-labelledby="twH">
            <h3 id="twH"><i class="fas fa-pen-to-square"></i> Today's work</h3>
            <div id="workBody"></div>

            <div class="totals" id="totals" hidden>
              <div><div class="k">Hours today</div><div class="v mono" id="tHours">0</div></div>
              <div><div class="k">Rows</div><div class="v mono" id="tRows">0</div></div>
              <div><div class="k">Standard day</div><div class="v mono">8.5</div></div>
            </div>
            <ul class="hints" id="hints"></ul>

            <div class="submitrow">
              <p id="submitNote">Hours are what you worked. Submitting sends the day to your manager.</p>
              <button class="btn primary" id="submitBtn" type="button"><i class="fas fa-paper-plane"></i> Submit day</button>
            </div>
          </section>
        </div>
      </div>
    </div>

    <div class="plist" id="plist" role="listbox" hidden></div>
    <script src="/static/timesheet/shell.js"></script>
    <script src="/static/timesheet/my-day.js"></script>
  </body>
</html>
