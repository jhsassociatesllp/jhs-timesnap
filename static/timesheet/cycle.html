<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
    <title>Late projects — JHS</title>
    <link rel="icon" type="image/png" href="/static/jhs_logo.jpg" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/static/timesheet/styles.css" />
    <link rel="stylesheet" href="/static/timesheet/shell.css" />
    <link rel="stylesheet" href="/static/timesheet/my-day.css" />
    <link rel="stylesheet" href="/static/timesheet/daily.css" />
    <link rel="stylesheet" href="/static/timesheet/dashboards.css" />
    <link rel="stylesheet" href="/static/timesheet/dash-theme.css" />
  </head>
  <body>
    <div id="appNav" data-active="late"></div>

    <div class="container md">
      <div class="header"><h1><i class="fas fa-triangle-exclamation"></i> Late projects</h1></div>

      <div class="md-body">
        <div id="msg" class="dt-banner"></div>

        <section class="day-head filters">
          <div class="form-group"><label for="cycleSel">10-day cycle</label><select id="cycleSel"></select></div>
          <div class="form-group" id="teamWrap" style="display:none"><label for="team">Manager code (admin)</label>
            <input type="text" id="team" placeholder="all teams" maxlength="20" /></div>
          <button class="dt-btn" id="go" type="button"><i class="fas fa-rotate"></i> Show</button>
        </section>

        <div class="dt-card">
          <h3><i class="fas fa-triangle-exclamation"></i> Projects running late (amber and red)</h3>
          <p class="sub" id="wbNote"></p>
          <p class="sub">For each late task you can say how many more hours it needs and a new end date, then Save. This does not approve or change any timesheet.
            Approving timesheets is done in <a href="/static/timesheet/review.html">Review team</a>.</p>
          <div id="risk"></div>
        </div>
      </div>
    </div>
    <script src="/static/timesheet/shell.js"></script>
    <script src="/static/timesheet/cycle.js"></script>
  </body>
</html>
