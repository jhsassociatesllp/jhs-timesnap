<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
    <title>Daily Timesheet — JHS</title>
    <link rel="icon" type="image/png" href="/static/jhs_logo.jpg" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/static/timesheet/styles.css" />
    <style>
      .dt-card { background:#fff; border-radius:15px; box-shadow:var(--shadow-light); padding:1.2rem 1.5rem; margin:1rem 0; }
      .dt-card h3 { margin:0 0 .8rem; font-size:1rem; color:var(--text-dark); }
      .dt-banner { display:none; margin:1rem 0; padding:.8rem 1.2rem; border-radius:10px; font-weight:600; }
      .dt-banner.warn { background:#fef9c3; border:2px solid #fde047; color:#854d0e; }
      .dt-banner.err { background:#fee2e2; border:2px solid #fca5a5; color:#b91c1c; }
      .dt-banner.ok { background:#dcfce7; border:2px solid #86efac; color:#166534; }
      .dt-strip { display:flex; flex-wrap:wrap; gap:1.5rem; }
      .dt-strip div span { display:block; font-size:.75rem; color:var(--text-light); text-transform:uppercase; }
      .dt-strip div b { font-size:1.15rem; }
      .dt-grid { width:100%; border-collapse:collapse; }
      .dt-grid th { text-align:left; font-size:.78rem; text-transform:uppercase; color:var(--text-light); padding:.4rem .5rem; }
      .dt-grid td { padding:.35rem .5rem; vertical-align:top; border-top:1px solid var(--border-color); }
      .dt-grid input, .dt-grid select, .dt-card textarea, .dt-card input[type=date] {
        width:100%; padding:.55rem; border:1px solid var(--border-color); border-radius:8px; font-size:.9rem; font-family:inherit; }
      .dt-grid input[type=number] { width:90px; }
      .dt-tag { display:inline-block; padding:.1rem .5rem; border-radius:999px; font-size:.72rem; font-weight:600; background:#e0e7ff; color:#3730a3; }
      .dt-tag.red { background:#fee2e2; color:#b91c1c; }
      .dt-totals { display:flex; flex-wrap:wrap; gap:2rem; align-items:center; }
      .dt-totals b { font-size:1.3rem; }
      .dt-ok { color:#15803d; } .dt-bad { color:#b91c1c; }
      .dt-actions { display:flex; gap:.8rem; flex-wrap:wrap; margin-top:1rem; }
      .dt-btn { border:none; border-radius:10px; padding:.8rem 1.6rem; font-weight:600; cursor:pointer; color:#fff; background:var(--secondary-gradient); }
      .dt-btn.go { background:var(--success-gradient); }
      .dt-btn.del { background:var(--danger-gradient); padding:.5rem .9rem; }
      .dt-btn:disabled { opacity:.5; cursor:not-allowed; }
      .dt-muted { color:var(--text-light); font-size:.85rem; }
      @media (max-width: 800px) { .dt-grid thead { display:none; } .dt-grid td { display:block; } .dt-grid input[type=number] { width:100%; } }
    </style>
  </head>
  <body>
    <div class="navbar">
      <div class="nav-menu active" style="position:static;display:flex;gap:1rem;width:auto;background:none;box-shadow:none;">
        <a href="/timesheet" style="padding:.4rem 1rem"><i class="fas fa-arrow-left"></i> Timesheet</a>
        <a href="/modules" style="padding:.4rem 1rem"><i class="fas fa-th-large"></i> Modules</a>
      </div>
    </div>

    <div class="container">
      <div class="header"><h1><i class="fas fa-stopwatch"></i> DAILY TIMESHEET <small style="font-size:.5em">(pilot)</small></h1></div>

      <div id="bnNq" class="dt-banner warn">Project data may be out of date</div>
      <div id="bnMsg" class="dt-banner"></div>

      <div class="dt-card">
        <div style="display:flex;flex-wrap:wrap;gap:1.5rem;align-items:end;">
          <div><label for="dayPicker" class="dt-muted">Date</label><input type="date" id="dayPicker" /></div>
          <div class="dt-muted" id="cycleInfo"></div>
          <div id="statusTag"></div>
        </div>
      </div>

      <div class="dt-card">
        <h3>HRMS attendance</h3>
        <div class="dt-strip" id="hrmsStrip"></div>
      </div>

      <div class="dt-card">
        <h3>My tasks today</h3>
        <div class="table-responsive">
          <table class="dt-grid">
            <thead><tr><th>Task</th><th>Project</th><th>Ends</th><th>Status</th><th>Hours used / budget</th></tr></thead>
            <tbody id="tasksBody"></tbody>
          </table>
        </div>
        <div class="dt-muted" style="margin-top:.5rem;">Budget assumes 100% allocation (NQ has no allocation field).</div>
      </div>

      <div class="dt-card">
        <h3>What I did</h3>
        <table class="dt-grid">
          <thead><tr><th>Task</th><th>What I did</th><th>Hours</th><th>Status</th><th></th></tr></thead>
          <tbody id="entryBody"></tbody>
        </table>
        <div class="dt-actions"><button class="dt-btn" id="addRow" type="button"><i class="fas fa-plus"></i> Add entry</button></div>
      </div>

      <div class="dt-card">
        <h3>Totals</h3>
        <div class="dt-totals">
          <div><span class="dt-muted">Task hours</span><br /><b id="tTask">0</b></div>
          <div><span class="dt-muted">HRMS net</span><br /><b id="tNet">—</b></div>
          <div><span class="dt-muted">Difference</span><br /><b id="tDiff">—</b></div>
          <div id="tNote" class="dt-muted"></div>
        </div>
        <div id="recoWrap" style="display:none;margin-top:1rem;">
          <label for="recoReason" class="dt-muted">Reason for the difference (required outside the allowed range)</label>
          <textarea id="recoReason" rows="2" maxlength="500"></textarea>
        </div>
        <div class="dt-actions">
          <button class="dt-btn" id="saveBtn" type="button">Save draft</button>
          <button class="dt-btn go" id="submitBtn" type="button">Submit day</button>
        </div>
      </div>
    </div>

    <script src="/static/timesheet/daily.js"></script>
  </body>
</html>
