<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
    <title>HRMS upload — JHS</title>
    <link rel="icon" type="image/png" href="/static/jhs_logo.jpg" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/static/timesheet/styles.css" />
    <link rel="stylesheet" href="/static/timesheet/shell.css" />
    <link rel="stylesheet" href="/static/timesheet/my-day.css" />
    <link rel="stylesheet" href="/static/timesheet/daily.css" />
    <link rel="stylesheet" href="/static/timesheet/dashboards.css" />
    <link rel="stylesheet" href="/static/timesheet/dash-theme.css" />
  </head>
  <body>
    <div id="appNav" data-active="hrms"></div>

    <div class="container md">
      <div class="header"><h1><i class="fas fa-fingerprint"></i> HRMS attendance upload</h1></div>

      <div class="md-body">
        <div id="msg" class="dt-banner"></div>

        <section class="day-head status-panel">
          <div>
            <div class="cyc-label">Current status</div>
            <div id="status" class="status-line">Loading…</div>
            <div id="awaiting" class="dt-muted" style="margin-top:.4rem"></div>
          </div>
        </section>

        <div class="dt-card">
          <h3><span class="step">1</span> Choose the file</h3>
          <p class="sub">The HRMS attendance export, .xlsx or .csv, up to 10 MB. Nothing is saved until you import.</p>
          <input type="file" id="file" accept=".xlsx,.csv" />
          <div class="dt-actions"><button class="dt-btn" id="previewBtn" type="button"><i class="fas fa-magnifying-glass"></i> Preview</button></div>
        </div>

        <div class="dt-card" id="previewCard" style="display:none">
          <h3><span class="step">2</span> Check the preview</h3>
          <div class="kpi-row" id="previewStats"></div>
          <div id="warnings" class="dt-banner warn" style="display:none"></div>
          <div id="errorsWrap" style="display:none">
            <h3 style="margin-top:1rem">Row errors <span class="dt-muted">(these rows are skipped)</span></h3>
            <div class="table-responsive"><table class="dt-grid"><thead><tr><th>Row</th><th>Problem</th></tr></thead><tbody id="errorsBody"></tbody></table></div>
          </div>
          <div class="dt-actions"><button class="dt-btn go" id="importBtn" type="button"><i class="fas fa-file-import"></i> Import valid rows</button></div>
        </div>

        <div class="dt-card">
          <h3><i class="fas fa-clock-rotate-left"></i> Upload history</h3>
          <div class="table-responsive">
            <table class="dt-grid">
              <thead><tr><th>When</th><th>File</th><th>By</th><th>Dates</th><th>Imported</th><th>Errors</th></tr></thead>
              <tbody id="history"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
    <script src="/static/timesheet/shell.js"></script>
    <script src="/static/timesheet/hrms.js"></script>
  </body>
</html>
