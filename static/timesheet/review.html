<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
    <title>Review team — JHS</title>
    <link rel="icon" type="image/png" href="/static/jhs_logo.jpg" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/static/timesheet/styles.css" />
    <link rel="stylesheet" href="/static/timesheet/shell.css" />
    <link rel="stylesheet" href="/static/timesheet/my-day.css" />
    <link rel="stylesheet" href="/static/timesheet/review.css" />
  </head>
  <body>
    <div id="appNav" data-active="review"></div>

    <div class="container md">
      <div class="header"><h1><i class="fas fa-clipboard-check"></i> Review team</h1></div>

      <div class="md-body">
        <div id="banners" aria-live="polite"></div>

        <section class="day-head rv-head">
          <div class="rv-bar">
            <div class="form-group"><label for="cycleSel">Payroll and 10-day cycle</label><select class="inp" id="cycleSel"></select></div>
            <div class="form-group" id="teamWrap" hidden><label for="team">Manager code (admin)</label><input class="inp" id="team" maxlength="20" placeholder="all teams" /></div>
            <button class="btn small" id="go" type="button"><i class="fas fa-rotate"></i> Show</button>
          </div>
          <p class="rv-info" id="cycleInfo"></p>
        </section>

        <section class="card" aria-labelledby="teamH">
          <h3 id="teamH"><i class="fas fa-users"></i> Your team</h3>
          <p class="sub">Click <b>Review</b> on an employee to see every day, the tasks and the hours against what was allotted. You can approve at any time.</p>
          <div class="table-responsive">
            <table class="tbl">
              <thead><tr><th><input type="checkbox" id="all" aria-label="Select all" /></th><th>Employee</th><th class="num">Days filled</th><th class="num hide-s">Typed hrs</th><th class="num hide-s">HRMS hrs</th><th class="num hide-s">Difference</th><th class="num hide-s">Unplanned</th><th>Status</th><th class="hide-s">Open items</th><th></th></tr></thead>
              <tbody id="rows"></tbody>
            </table>
          </div>
          <label class="confirm" id="confirmWrap" hidden><input type="checkbox" id="confirm" /> <span id="confirmText"></span></label>
          <div class="rv-actions">
            <button class="btn good" id="approveBtn" type="button"><i class="fas fa-lock"></i> Approve &amp; lock selected</button>
          </div>
        </section>
      </div>
    </div>

    <div class="modal" id="rvModal" role="dialog" aria-modal="true" aria-labelledby="mTitle" hidden>
      <div class="modal-box" id="mBox" tabindex="-1">
        <div class="modal-head">
          <div><h2 id="mTitle"></h2><div class="sub" id="mSub"></div></div>
          <button type="button" class="modal-x" id="mClose" aria-label="Close">&times;</button>
        </div>
        <div class="modal-body" id="mBody"></div>
      </div>
    </div>

    <script src="/static/timesheet/shell.js"></script>
    <script src="/static/timesheet/review.js"></script>
  </body>
</html>
