<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JHS L&D Calendar FY 2026-27</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#EEF2F8;--paper:#FFFFFF;--ink:#1A2440;--muted:#5B6782;--line:#DCE3EE;--navy:#1B3A6B;--weekend:#F6F8FC;--off:#E7ECF4;
  --m:#1B3A6B;--m-soft:#E8EEF8;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"DM Sans","Segoe UI",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1626;--paper:#172238;--ink:#E7ECF6;--muted:#9AA7C2;--line:#2A3854;--navy:#8FB0E8;--weekend:#1B2740;--off:#131C2E;--m-soft:#22304D}}
:root[data-theme="dark"]{--bg:#0F1626;--paper:#172238;--ink:#E7ECF6;--muted:#9AA7C2;--line:#2A3854;--navy:#8FB0E8;--weekend:#1B2740;--off:#131C2E;--m-soft:#22304D}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--m);outline-offset:2px;border-radius:6px}
.wrap{max-width:1320px;margin:0 auto;padding:20px 20px 48px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:44px;height:44px;border-radius:12px;background:var(--navy);color:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:15px;letter-spacing:.5px}
:root[data-theme="dark"] .logo{color:#0F1626}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo{color:#0F1626}}
.brand h1{font-family:var(--display);font-size:20px;margin:0;line-height:1.15;font-weight:700}
.brand p{margin:0;color:var(--muted);font-size:13px}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:flex;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{border:0;background:none;padding:7px 14px;border-radius:9px;font-weight:500;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--m);color:#fff}
.search{position:relative}
.search input{font:inherit;font-size:14px;padding:8px 12px 8px 34px;border-radius:12px;border:1px solid var(--line);background:var(--paper);color:var(--ink);width:210px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);opacity:.55}
.iconbtn{border:1px solid var(--line);background:var(--paper);border-radius:12px;width:38px;height:38px;display:grid;place-items:center}

/* month strip */
.strip{display:grid;grid-template-columns:repeat(12,1fr);gap:6px;margin-bottom:18px}
.chip{border:0;border-radius:12px;padding:8px 4px 7px;background:var(--paper);display:flex;flex-direction:column;align-items:center;gap:4px;border-bottom:4px solid var(--c);transition:transform .15s}
.chip b{font-family:var(--display);font-size:14px;font-weight:700}
.chip small{font-size:11px;color:var(--muted)}
.chip .dots{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;max-width:60px;min-height:6px}
.chip .dots i{width:6px;height:6px;border-radius:50%;background:var(--dc)}
.chip:hover{transform:translateY(-2px)}
.chip[aria-current="true"]{background:var(--c);color:#fff}
.chip[aria-current="true"] small{color:rgba(255,255,255,.85)}
.chip[aria-current="true"] .dots i{background:#fff!important;opacity:.85}

/* layout */
.main{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px;align-items:start}
.panel{background:var(--paper);border-radius:18px;border:1px solid var(--line)}

/* month hero */
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:22px 24px 18px;background:var(--m);color:#fff;border-radius:18px 18px 0 0;position:relative;overflow:hidden}
.hero h2{font-family:var(--display);font-weight:800;font-size:clamp(34px,5vw,60px);line-height:.95;margin:0;letter-spacing:-1.5px}
.hero h2 span{font-weight:500;opacity:.7;font-size:.55em;letter-spacing:0;margin-left:10px}
.hero .big{position:absolute;right:170px;bottom:-40px;font-family:var(--display);font-weight:800;font-size:170px;line-height:1;opacity:.12;pointer-events:none}
.nav{display:flex;gap:8px;position:relative}
.nav button{background:rgba(255,255,255,.18);border:0;color:#fff;height:38px;min-width:38px;border-radius:10px;padding:0 12px;font-weight:600;font-size:14px}
.nav button:hover{background:rgba(255,255,255,.3)}
.nav button:disabled{opacity:.35;cursor:default}
.stats{display:flex;gap:18px;flex-wrap:wrap;padding:12px 24px;border-bottom:1px solid var(--line);font-size:14px;color:var(--muted)}
.stats strong{color:var(--ink);font-family:var(--display);font-size:18px;margin-right:4px}

/* grid */
.dow,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.dow div{padding:10px 10px 6px;font-size:12.5px;font-weight:700;color:var(--muted)}
.dow div:nth-child(n+6){color:var(--m)}
.grid{border-top:1px solid var(--line)}
.day{min-height:118px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px;display:flex;flex-direction:column;gap:4px;background:var(--paper);text-align:left;border-top:0;border-left:0;border-radius:0;cursor:pointer;position:relative}
.day:nth-child(7n){border-right:0}
.day.we{background:var(--weekend)}
.day.off{background:var(--off);cursor:default}
.day .n{font-family:var(--display);font-weight:700;font-size:15px;width:28px;height:28px;display:grid;place-items:center;border-radius:50%}
.day.sun .n{color:#C62828}
.day.today .n{background:var(--m);color:#fff}
.day.hol{background:color-mix(in srgb,#2E7D32 9%,var(--paper))}
.day:not(.off):hover{background:var(--m-soft)}
.day.sel{box-shadow:inset 0 0 0 2px var(--m)}
.ev{display:flex;align-items:flex-start;gap:5px;font-size:12px;line-height:1.3;padding:3px 6px;border-radius:6px;background:var(--soft);color:var(--txt);font-weight:500;overflow:hidden}
.ev .e{flex:none}
.ev .t{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ev.tbc{background:transparent;border:1.5px dashed var(--strong)}
.more{font-size:11.5px;color:var(--muted);padding-left:6px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .ev{background:color-mix(in srgb,var(--strong) 28%,var(--paper));color:var(--ink)}}
:root[data-theme="dark"] .ev{background:color-mix(in srgb,var(--strong) 28%,var(--paper));color:var(--ink)}

/* sidebar */
.side{display:flex;flex-direction:column;gap:18px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
.side h3{font-family:var(--display);font-size:17px;margin:0 0 10px;font-weight:700}
.box{padding:18px}
.detail .date{font-family:var(--display);font-size:26px;font-weight:800;line-height:1.1;margin:0}
.detail .wd{color:var(--muted);font-size:14px;margin:2px 0 12px}
.card{border-left:4px solid var(--strong);background:var(--soft);border-radius:4px 10px 10px 4px;padding:10px 12px;margin-bottom:8px;color:var(--txt)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .card{background:color-mix(in srgb,var(--strong) 22%,var(--paper));color:var(--ink)}}
:root[data-theme="dark"] .card{background:color-mix(in srgb,var(--strong) 22%,var(--paper));color:var(--ink)}
.card .cat{font-size:12px;font-weight:700;opacity:.85}
.card .ttl{font-weight:700;font-size:15px;line-height:1.3;margin:2px 0}
.card .meta{font-size:13px;opacity:.9}
.card .note{font-size:12.5px;margin-top:6px;opacity:.85;font-style:italic}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:1px 8px;border-radius:20px;margin-left:6px;vertical-align:middle}
.badge.tbc{background:#FFC107;color:#3E2723}
.empty{color:var(--muted);font-size:14px;margin:0}
.up{list-style:none;margin:0;padding:0}
.up li button{width:100%;display:grid;grid-template-columns:46px 1fr;gap:10px;align-items:center;background:none;border:0;padding:8px 6px;border-radius:10px;text-align:left}
.up li button:hover{background:var(--m-soft)}
.cal{border-radius:10px;overflow:hidden;text-align:center;border:1px solid var(--line);background:var(--paper)}
.cal i{display:block;font-style:normal;font-size:10.5px;font-weight:700;color:#fff;background:var(--strong);padding:1px 0}
.cal b{display:block;font-family:var(--display);font-size:18px;line-height:1.4}
.up .ut{font-size:13.5px;font-weight:600;line-height:1.3}
.up .us{font-size:12px;color:var(--muted)}
.legend{display:flex;flex-direction:column;gap:4px}
.legend label{display:flex;align-items:center;gap:10px;font-size:14px;padding:5px 6px;border-radius:8px;cursor:pointer;user-select:none}
.legend label:hover{background:var(--m-soft)}
.legend input{position:absolute;opacity:0;pointer-events:none}
.sw{width:18px;height:18px;border-radius:6px;background:var(--strong);display:grid;place-items:center;flex:none;border:2px solid var(--strong)}
.sw::after{content:"";width:8px;height:4px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translateY(-1px)}
.legend input:not(:checked)+.sw{background:transparent}
.legend input:not(:checked)+.sw::after{display:none}
.legend input:not(:checked)~span{color:var(--muted);text-decoration:line-through}
.legend input:focus-visible+.sw{outline:3px solid var(--m);outline-offset:2px}
.legend .cnt{margin-left:auto;font-size:12px;color:var(--muted)}
.linkbtn{background:none;border:0;color:var(--m);font-weight:600;font-size:13px;padding:0}
.rowh{display:flex;justify-content:space-between;align-items:baseline}

/* year view */
.year{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;padding:18px}
.mini{display:block;align-self:start;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--paper);text-align:left;padding:0}
.mini h4{margin:0;padding:9px 12px;background:var(--c);color:#fff;font-family:var(--display);font-size:16px;display:flex;justify-content:space-between}
.mini h4 small{font-family:var(--body);font-weight:500;opacity:.85;font-size:12px}
.mg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;padding:8px}
.mg span{font-size:11.5px;text-align:center;padding:4px 0;border-radius:6px}
.mg .h{font-weight:700;color:var(--muted);font-size:10.5px}
.mg .has{background:var(--strong);color:#fff;font-weight:700}
.mg .su{color:#C62828}
.mg .td{outline:2px solid var(--ink)}
.mini:hover{border-color:var(--c)}

/* list view */
.list{padding:8px 18px 18px}
.list h4{font-family:var(--display);font-size:20px;margin:20px 0 8px;color:var(--c);font-weight:800}
.lrow{display:grid;grid-template-columns:92px 1fr auto;gap:14px;align-items:center;padding:10px 12px;border-radius:12px;border:1px solid var(--line);margin-bottom:6px;background:var(--paper)}
.lrow .ld{font-family:var(--display);font-weight:700;line-height:1.15}
.lrow .ld small{display:block;font-family:var(--body);font-weight:500;color:var(--muted);font-size:12px}
.lrow .pill{font-size:12px;font-weight:700;padding:3px 10px;border-radius:20px;background:var(--strong);color:#fff;white-space:nowrap}
.lrow .lt{font-weight:600}
.lrow .lm{font-size:13px;color:var(--muted)}
.lrow.past{opacity:.55}
.noresult{padding:40px 20px;text-align:center;color:var(--muted)}

.foot{margin-top:18px;color:var(--muted);font-size:12.5px;text-align:center}
.hide{display:none!important}

@media (max-width:1000px){.main{grid-template-columns:minmax(0,1fr)}.side{position:static}.strip{grid-template-columns:repeat(6,1fr)}}
@media (max-width:680px){
  .wrap{padding:14px 12px 40px}
  .search input{width:100%}.search{flex:1 1 100%}.tools{width:100%}.seg{flex:1}.seg button{flex:1}.hero{flex-wrap:wrap}.stats{gap:6px 14px;padding:10px 16px}
  .dow div{font-size:11px;padding:8px 2px;text-align:center}
  .day{min-height:58px;padding:4px 2px;align-items:center}
  .day .ev{display:none}.day .more{display:none}
  .day .dotrow{display:flex}
  .hero{padding:18px}.hero .big{font-size:110px;bottom:-24px;right:-6px}
  .lrow{grid-template-columns:70px 1fr}.lrow .pill{grid-column:2;justify-self:start}
}
.dotrow{display:none;gap:2px;flex-wrap:wrap;justify-content:center}
.dotrow i{width:6px;height:6px;border-radius:50%;background:var(--strong)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{
  body{background:#fff}.tools,.strip,.side,.nav{display:none!important}.main{grid-template-columns:1fr}
  .panel{border:0}.hero{-webkit-print-color-adjust:exact;print-color-adjust:exact}.ev,.day{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="logo" aria-hidden="true">JHS</div>
      <div><h1>Learning &amp; Development Calendar</h1><p>JHS Associates LLP, FY 2026-27 (April 2026 to March 2027)</p></div>
    </div>
    <div class="tools">
      <div class="search">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Search events or speakers" aria-label="Search events or speakers">
      </div>
      <div class="seg" role="group" aria-label="View">
        <button data-view="month" aria-pressed="true">Month</button>
        <button data-view="year" aria-pressed="false">Year</button>
        <button data-view="list" aria-pressed="false">List</button>
      </div>
      <button class="iconbtn" id="themeBtn" aria-label="Switch light or dark mode" title="Light / dark">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </div>
  </header>

  <nav class="strip" id="strip" aria-label="Months"></nav>

  <div class="main">
    <section class="panel" id="stage" aria-live="polite"></section>
    <aside class="side">
      <div class="panel box detail" id="detail"></div>
      <div class="panel box">
        <h3>Coming up</h3>
        <ul class="up" id="up"></ul>
      </div>
      <div class="panel box">
        <div class="rowh"><h3>Show on calendar</h3><button class="linkbtn" id="allBtn">Show all</button></div>
        <div class="legend" id="legend"></div>
      </div>
    </aside>
  </div>
  <p class="foot">Dashed outline means the event is still to be confirmed. Use the ← and → keys to change month.</p>
</div>

<script>

const CATS = {
 "Public Holiday":["🗓","#2E7D32","#DDF0DE","#1B5E20"],
 "Hall of Fame":["🏆","#E0A000","#FFF4C2","#6D4C00"],
 "Annual Client Meet":["🤝","#8E24AA","#F1DDF5","#4A148C"],
 "Physical Training":["🏢","#E64A19","#FFE0D5","#8C2A0B"],
 "Online Training":["💻","#5E35B1","#E6DDF6","#311B92"],
 "Guest Session":["🎤","#EF7C00","#FFE9CC","#7A3E00"],
 "Activity / Fun Event":["🎉","#D81B60","#FCDDE8","#880E4F"],
 "Star Performer":["⭐","#1E88E5","#DCEBFB","#0D47A1"],
 "Chai Pe Charcha":["☕","#00897B","#D4EFEB","#004D40"],
 "Knowledge Setu":["📚","#455A64","#E1E8EB","#1F2D33"],
 "Excellencia":["🌟","#6D4C41","#EBE0DB","#3E2723"]
};
const THEME={3:"#00897B",4:"#EF6C00",5:"#3949AB",6:"#0097A7",7:"#E53935",8:"#689F38",9:"#8E24AA",10:"#F57C00",11:"#C62828",0:"#1E88E5",1:"#D81B60",2:"#43A047"};
const MONTHS=[];for(let i=0;i<12;i++){const d=new Date(2026,3+i,1);MONTHS.push({y:d.getFullYear(),m:d.getMonth()})}
const MN=["January","February","March","April","May","June","July","August","September","October","November","December"];
const WD=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const pad=n=>String(n).padStart(2,"0");
const key=(y,m,d)=>`${y}-${pad(m+1)}-${pad(d)}`;
const today=new Date();const TODAY=key(today.getFullYear(),today.getMonth(),today.getDate());
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const vars=c=>{const k=CATS[c];return `--strong:${k[1]};--soft:${k[2]};--txt:${k[3]}`};

function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
let state={view:"month",idx:0,sel:null,q:"",off:new Set()};
// start on current month if inside FY
{const i=MONTHS.findIndex(x=>x.y===today.getFullYear()&&x.m===today.getMonth());state.idx=i<0?0:i;state.sel=i<0?null:TODAY}
try{const o=JSON.parse(store("jhs-off")||"[]");o.forEach(c=>state.off.add(c))}catch(e){}
const savedTheme=store("jhs-theme");if(savedTheme)document.documentElement.dataset.theme=savedTheme;

function visible(){
  const q=state.q.trim().toLowerCase();
  return EVENTS.filter(e=>!state.off.has(e.c)&&(!q||(e.t+" "+e.f+" "+e.c).toLowerCase().includes(q)));
}
function byDate(list){const m={};list.forEach(e=>(m[e.d]=m[e.d]||[]).push(e));return m}
function title(e){return (e.c==="Online Training"||e.c==="Physical Training"||e.c==="Guest Session")&&e.t!==e.c?e.t:e.t}
function setMonthColor(){const c=THEME[MONTHS[state.idx].m];document.documentElement.style.setProperty("--m",c);document.documentElement.style.setProperty("--m-soft",`color-mix(in srgb, ${c} 12%, var(--paper))`)}

function renderStrip(){
  const all=byDate(visible());
  document.getElementById("strip").innerHTML=MONTHS.map((x,i)=>{
    const evs=Object.entries(all).filter(([d])=>d.startsWith(`${x.y}-${pad(x.m+1)}`)).flatMap(([,v])=>v);
    const dots=evs.slice(0,12).map(e=>`<i style="--dc:${CATS[e.c][1]}"></i>`).join("");
    return `<button class="chip" style="--c:${THEME[x.m]}" data-i="${i}" aria-current="${state.view==="month"&&i===state.idx}" aria-label="${MN[x.m]} ${x.y}, ${evs.length} events"><b>${MN[x.m].slice(0,3)}</b><small>${x.y}</small><span class="dots">${dots}</span></button>`}).join("");
}

function renderMonth(){
  const {y,m}=MONTHS[state.idx];const map=byDate(visible());
  const first=new Date(y,m,1);const lead=(first.getDay()+6)%7;const days=new Date(y,m+1,0).getDate();
  const monthEvs=Object.entries(map).filter(([d])=>d.startsWith(`${y}-${pad(m+1)}`)).flatMap(([,v])=>v);
  const cnt=f=>monthEvs.filter(f).length;const pl=(n,a,b)=>`<strong>${n}</strong>${n===1?a:b}`;
  let cells="";
  for(let i=0;i<lead;i++)cells+=`<div class="day off" aria-hidden="true"></div>`;
  for(let d=1;d<=days;d++){
    const k=key(y,m,d);const evs=map[k]||[];const dow=(lead+d-1)%7;
    const cls=["day",dow>=5?"we":"",dow===6?"sun":"",k===TODAY?"today":"",evs.some(e=>e.c==="Public Holiday")?"hol":"",k===state.sel?"sel":""].join(" ");
    const shown=evs.slice(0,3).map(e=>`<span class="ev${e.s==="TBC"?" tbc":""}" style="${vars(e.c)}"><span class="e">${CATS[e.c][0]}</span><span class="t">${esc(title(e))}</span></span>`).join("");
    const more=evs.length>3?`<span class="more">+${evs.length-3} more</span>`:"";
    const dots=`<span class="dotrow">${evs.map(e=>`<i style="${vars(e.c)}"></i>`).join("")}</span>`;
    cells+=`<button class="${cls}" data-d="${k}" aria-label="${d} ${MN[m]}${evs.length?", "+evs.map(e=>e.t).join(", "):", no events"}"><span class="n">${d}</span>${shown}${more}${dots}</button>`;
  }
  const tail=(7-(lead+days)%7)%7;for(let i=0;i<tail;i++)cells+=`<div class="day off" aria-hidden="true"></div>`;
  document.getElementById("stage").innerHTML=`
   <div class="hero"><div class="big" aria-hidden="true">${pad(m+1)}</div>
     <h2>${MN[m]}<span>${y}</span></h2>
     <div class="nav"><button id="prev" aria-label="Previous month" ${state.idx===0?"disabled":""}>‹</button><button id="todayBtn">Today</button><button id="next" aria-label="Next month" ${state.idx===11?"disabled":""}>›</button></div>
   </div>
   <div class="stats">
     <span>${pl(cnt(e=>/Training|Guest/.test(e.c)),"training","trainings")}</span>
     <span>${pl(cnt(e=>!/Training|Guest|Holiday/.test(e.c)),"event or celebration","events &amp; celebrations")}</span>
     <span>${pl(cnt(e=>e.c==="Public Holiday"),"holiday","holidays")}</span>
     <span>${pl(cnt(e=>e.s==="TBC"),"to be confirmed","to be confirmed")}</span>
   </div>
   <div class="dow"><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div><div>Sun</div></div>
   <div class="grid">${cells}</div>`;
}

function renderYear(){
  const map=byDate(visible());
  document.getElementById("stage").innerHTML=`<div class="year">${MONTHS.map((x,i)=>{
    const lead=(new Date(x.y,x.m,1).getDay()+6)%7,days=new Date(x.y,x.m+1,0).getDate();
    let g="MTWTFSS".split("").map(c=>`<span class="h">${c}</span>`).join("")+"<span></span>".repeat(lead);let n=0;
    for(let d=1;d<=days;d++){const k=key(x.y,x.m,d),e=map[k];if(e)n+=e.length;const dow=(lead+d-1)%7;
      g+=`<span class="${e?"has":""} ${dow===6&&!e?"su":""} ${k===TODAY?"td":""}" ${e?`style="${vars(e[0].c)}" title="${esc(e.map(z=>z.t).join(", "))}"`:""}>${d}</span>`}
    return `<button class="mini" style="--c:${THEME[x.m]}" data-i="${i}" aria-label="Open ${MN[x.m]} ${x.y}"><h4>${MN[x.m]} <small>${n} events</small></h4><div class="mg">${g}</div></button>`}).join("")}</div>`;
}

function renderList(){
  const list=visible();
  if(!list.length){document.getElementById("stage").innerHTML=`<div class="noresult">No events match. Clear the search or turn categories back on.</div>`;return}
  let html="",cur="";
  list.forEach(e=>{const d=new Date(e.d+"T00:00");const mk=e.d.slice(0,7);
    if(mk!==cur){cur=mk;html+=`<h4 style="--c:${THEME[d.getMonth()]}">${MN[d.getMonth()]} ${d.getFullYear()}</h4>`}
    html+=`<div class="lrow${e.d<TODAY?" past":""}" style="${vars(e.c)}"><div class="ld">${d.getDate()} ${MN[d.getMonth()].slice(0,3)}<small>${WD[d.getDay()]}</small></div>
      <div><div class="lt">${CATS[e.c][0]} ${esc(e.t)}${e.s==="TBC"?'<span class="badge tbc">TBC</span>':""}</div><div class="lm">${[e.f,e.tm].filter(Boolean).map(esc).join(", ")||"&nbsp;"}</div></div>
      <span class="pill">${esc(e.c)}</span></div>`});
  document.getElementById("stage").innerHTML=`<div class="list">${html}</div>`;
}

function renderDetail(){
  const el=document.getElementById("detail");
  if(!state.sel){el.innerHTML=`<h3>Day details</h3><p class="empty">Select a date to see what's planned.</p>`;return}
  const d=new Date(state.sel+"T00:00");const evs=visible().filter(e=>e.d===state.sel);
  el.innerHTML=`<p class="date">${d.getDate()} ${MN[d.getMonth()]}</p><p class="wd">${WD[d.getDay()]}, ${d.getFullYear()}</p>`+
   (evs.length?evs.map(e=>`<div class="card" style="${vars(e.c)}"><div class="cat">${CATS[e.c][0]} ${esc(e.c)}${e.s==="TBC"?'<span class="badge tbc">To be confirmed</span>':""}</div>
     <div class="ttl">${esc(e.t)}</div>${e.f||e.tm?`<div class="meta">${[e.f&&("By "+e.f),e.tm].filter(Boolean).map(esc).join("<br>")}</div>`:""}
     ${e.r&&e.s==="TBC"?`<div class="note">${esc(e.r)}</div>`:""}</div>`).join(""):`<p class="empty">Nothing planned on this day.</p>`);
}

function renderUp(){
  const nx=visible().filter(e=>e.d>=TODAY).slice(0,6);
  document.getElementById("up").innerHTML=nx.length?nx.map(e=>{const d=new Date(e.d+"T00:00");
    return `<li><button data-go="${e.d}" style="${vars(e.c)}"><span class="cal"><i>${MN[d.getMonth()].slice(0,3)}</i><b>${d.getDate()}</b></span><span><div class="ut">${CATS[e.c][0]} ${esc(e.t)}${e.s==="TBC"?'<span class="badge tbc">TBC</span>':""}</div><div class="us">${WD[d.getDay()]}${e.tm?", "+esc(e.tm):""}</div></span></button></li>`}).join("")
   :`<li class="empty">No more events this financial year.</li>`;
}

function renderLegend(){
  document.getElementById("legend").innerHTML=Object.keys(CATS).map(c=>`<label style="${vars(c)}"><input type="checkbox" value="${c}" ${state.off.has(c)?"":"checked"}><span class="sw"></span><span>${CATS[c][0]} ${c}</span><span class="cnt">${EVENTS.filter(e=>e.c===c).length}</span></label>`).join("");
}

function render(){
  setMonthColor();
  document.querySelectorAll(".seg button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.view===state.view));
  renderStrip();
  ({month:renderMonth,year:renderYear,list:renderList})[state.view]();
  renderDetail();renderUp();
}
function goDate(k){const d=new Date(k+"T00:00");const i=MONTHS.findIndex(x=>x.y===d.getFullYear()&&x.m===d.getMonth());if(i>=0){state.idx=i;state.view="month";state.sel=k;render()}}

document.addEventListener("click",e=>{
  const t=e.target.closest("button");if(!t)return;
  if(t.dataset.view){state.view=t.dataset.view;render()}
  else if(t.classList.contains("chip")||t.classList.contains("mini")){state.idx=+t.dataset.i;state.view="month";render()}
  else if(t.id==="prev"&&state.idx>0){state.idx--;render()}
  else if(t.id==="next"&&state.idx<11){state.idx++;render()}
  else if(t.id==="todayBtn"){const i=MONTHS.findIndex(x=>x.y===today.getFullYear()&&x.m===today.getMonth());if(i>=0){state.idx=i;state.sel=TODAY;render()}}
  else if(t.dataset.d){state.sel=t.dataset.d;render();if(innerWidth<1000)document.getElementById("detail").scrollIntoView({behavior:"smooth",block:"start"})}
  else if(t.dataset.go){goDate(t.dataset.go)}
  else if(t.id==="allBtn"){state.off.clear();store("jhs-off","[]");renderLegend();render()}
  else if(t.id==="themeBtn"){const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;r.dataset.theme=dark?"light":"dark";store("jhs-theme",r.dataset.theme)}
});
document.getElementById("legend").addEventListener("change",e=>{const c=e.target.value;e.target.checked?state.off.delete(c):state.off.add(c);store("jhs-off",JSON.stringify([...state.off]));render()});
document.getElementById("q").addEventListener("input",e=>{state.q=e.target.value;if(state.q&&state.view==="month")state.view="list";render()});
document.addEventListener("keydown",e=>{if(e.target.tagName==="INPUT"||state.view!=="month")return;
  if(e.key==="ArrowLeft"&&state.idx>0){state.idx--;render()}if(e.key==="ArrowRight"&&state.idx<11){state.idx++;render()}});
renderLegend();render();
</script>
</body>
</html>
