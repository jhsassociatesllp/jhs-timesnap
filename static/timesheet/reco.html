<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
    <title>Hours reconciliation — JHS</title>
    <link rel="icon" type="image/png" href="/static/jhs_logo.jpg" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/static/timesheet/styles.css" />
    <link rel="stylesheet" href="/static/timesheet/shell.css" />
    <link rel="stylesheet" href="/static/timesheet/my-day.css" />
    <link rel="stylesheet" href="/static/timesheet/daily.css" />
    <link rel="stylesheet" href="/static/timesheet/dashboards.css" />
    <link rel="stylesheet" href="/static/timesheet/dash-theme.css" />
  </head>
  <body>
    <div id="appNav" data-active="reco"></div>

    <div class="container md">
      <div class="header"><h1><i class="fas fa-scale-balanced"></i> Hours reconciliation</h1></div>

      <div class="md-body">
        <div id="msg" class="dt-banner"></div>

        <section class="day-head filters">
          <div class="form-group"><label for="from">From</label><input type="date" id="from" /></div>
          <div class="form-group"><label for="to">To</label><input type="date" id="to" /></div>
          <div class="form-group" id="teamWrap" style="display:none"><label for="team">Team (manager code)</label>
            <input type="text" id="team" placeholder="all teams" maxlength="20" /></div>
          <button class="dt-btn" id="go" type="button"><i class="fas fa-rotate"></i> Show</button>
          <div class="asof"><span id="lastUpload"></span><br /><span id="awaiting"></span></div>
        </section>

        <div class="kpi-row" id="summary"></div>

        <div class="dt-card">
          <h3><i class="fas fa-list-check"></i> Day by day</h3>
          <p class="sub">Typed hours are compared with HRMS net hours (gross minus 30 minutes lunch). A gap of 0.5 h or less counts as matched.</p>
          <div class="table-responsive">
            <table class="dt-grid">
              <thead><tr><th>Date</th><th>Employee</th><th>HRMS net</th><th>Timesheet</th><th>Diff</th><th>Result</th><th>Employee's reason</th><th>Review</th></tr></thead>
              <tbody id="rows"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
    <script src="/static/timesheet/shell.js"></script>
    <script src="/static/timesheet/reco.js"></script>
  </body>
</html>
