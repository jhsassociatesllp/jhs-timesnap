<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in | Onboarding Assessment</title>
  <link rel="stylesheet" href="/static/hr_policy_quiz/css/style.css" />
</head>
<body>
  <div class="topbar">
    <div class="brand">
      <img src="/static/hr_policy_quiz/assets/logo.svg" alt="" />
      <div>
        <div class="brand-name">Onboarding Assessment</div>
        <div class="brand-sub">New Joiner Portal</div>
      </div>
    </div>
    <div class="topbar-right"><a href="/hr-quiz/">Back</a></div>
  </div>

  <div class="page">
    <div class="card">
      <div class="card-top-bar"></div>
      <div class="eyebrow">Assessment access</div>
      <h1>Sign in to start</h1>
      <p style="color:var(--gray-600); margin-bottom:22px; font-size:13.5px;">Use the email and password shared with you by HR. The assessment has 15 questions, 30 seconds each.</p>

      <div class="error-box" id="errorBox"></div>

      <form id="loginForm">
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" required autocomplete="username" />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" required autocomplete="current-password" />
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Sign in</button>
      </form>
      <p class="hint" style="margin-top:16px;">Forgot your password? Ask HR to regenerate it for you.</p>
    </div>
  </div>

  <script src="/static/hr_policy_quiz/js/api.js"></script>
  <script src="/static/hr_policy_quiz/js/candidate-login.js"></script>
</body>
</html>
